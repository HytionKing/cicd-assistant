<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}"/>
    <title>任务列表 - CICD Assistant</title>
    <link rel="stylesheet" th:href="@{/vendor/tabler/css/tabler.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/tabler-icons/tabler-icons.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/tom-select/css/tom-select.bootstrap5.min.css}"/>
    <link rel="stylesheet" th:href="@{/vendor/flatpickr/css/flatpickr.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/app.css(v=20260725-tasks3)}"/>
</head>
<body>
<div class="page">
    <div th:replace="~{layout :: sidebar('launch.tasks')}"></div>
    <div class="page-wrapper">
        <!-- sticky 顶部容器：标题 + 查询表单，滚动时始终可见 -->
        <div class="page-header page-header-sticky">
            <div class="container-fluid">
                <div class="d-flex align-items-center mb-2">
                    <h2 class="page-title mb-0"><i class="ti ti-list-check me-2"></i>任务列表</h2>
                    <span class="text-secondary small ms-3" id="task-count-hint"></span>
                    <div class="ms-auto">
                        <button id="btn-refresh" class="btn btn-sm">
                            <i class="ti ti-refresh me-1"></i>刷新
                        </button>
                    </div>
                </div>
                <!-- 查询表单：tom-select 接管仓库/分支多选，flatpickr 接管日期。Enter 提交、"重置"清空 -->
                <form id="filter-form" class="row g-2 align-items-end">
                    <div class="col-md-3">
                        <label class="form-label mb-1 small">仓库（多选）</label>
                        <select id="f-repo" multiple placeholder="全部仓库"></select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label mb-1 small">分支（多个，可输入回车创建）</label>
                        <select id="f-branch" multiple placeholder="留空=全部；输入分支名回车添加"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1 small">状态</label>
                        <select id="f-status" class="form-select form-select-sm">
                            <option value="">全部</option>
                            <option value="PENDING">PENDING</option>
                            <option value="RUNNING">RUNNING</option>
                            <option value="SUCCESS">SUCCESS</option>
                            <option value="PARTIAL">PARTIAL</option>
                            <option value="FAILED">FAILED</option>
                            <option value="STOPPED">STOPPED</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1 small">创建时间起</label>
                        <input id="f-from" type="text" class="form-control form-control-sm" placeholder="选择日期"/>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label mb-1 small">创建时间止</label>
                        <input id="f-to" type="text" class="form-control form-control-sm" placeholder="选择日期"/>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2">
                        <button type="button" id="btn-reset" class="btn btn-sm">
                            <i class="ti ti-eraser me-1"></i>重置
                        </button>
                        <button type="submit" class="btn btn-sm btn-primary">
                            <i class="ti ti-search me-1"></i>查询
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <div class="page-body">
            <div class="container-fluid">
                <div class="card">
                    <div class="table-responsive">
                        <table class="table table-vcenter card-table">
                            <thead>
                            <tr>
                                <th>ID</th><th>仓库</th><th>分支</th><th>状态</th>
                                <th>是否保活</th>
                                <th>创建时间</th><th>完成时间</th><th class="text-end">操作</th>
                            </tr>
                            </thead>
                            <tbody id="task-tbody"></tbody>
                        </table>
                    </div>
                    <div class="card-footer" id="task-pager"></div>
                </div>
            </div>
        </div>
    </div>
</div>
<script th:src="@{/vendor/tabler/js/tabler.min.js}"></script>
<script th:src="@{/vendor/tom-select/js/tom-select.complete.min.js}"></script>
<script th:src="@{/vendor/flatpickr/js/flatpickr.min.js}"></script>
<script th:src="@{/vendor/flatpickr/l10n/zh.js}"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/ui.js}"></script>
<script th:src="@{/js/tasks.js}"></script>
</body>
</html>
